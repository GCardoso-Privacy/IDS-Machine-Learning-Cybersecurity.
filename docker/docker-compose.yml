services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin123
    volumes:
      - mongodb_data:/data/db
    restart: always

  shodan-worker:
    build:
      context: .
      dockerfile: Dockerfile.miner
    container_name: shodan-worker
    depends_on:
      - mongodb
    env_file:
      - .env
    volumes:
      - ./Modelos:/app/Modelos
    restart: always

volumes:
  mongodb_data:
